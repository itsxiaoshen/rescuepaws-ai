<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RescuePaws AI</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; background: #fafafa; color: #222; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .subtitle { color: #666; margin-top: 0; }
    #messages { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; height: 60vh; overflow-y: auto; }
    .msg { margin: 10px 0; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; line-height: 1.4; }
    .user { background: #e8f0fe; margin-left: 15%; }
    .assistant { background: #f1f3f4; margin-right: 15%; }
    .error { background: #fde8e8; color: #a00; }
    .tools { font-size: 0.8rem; color: #777; margin-top: 6px; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; font-size: 1rem; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
    button:disabled { background: #999; }
    .examples button { background: #fff; color: #1a73e8; border: 1px solid #1a73e8; font-size: 0.85rem; padding: 6px 10px; margin: 4px 4px 0 0; }
  </style>
</head>
<body>
  <h1>🐾 RescuePaws AI</h1>
  <p class="subtitle">Adoption assistant demo. Animal and policy data are synthetic.</p>

  <div id="messages"></div>
  <div class="examples">
    <button type="button">We have a toddler and another dog. Any calm medium-sized dogs?</button>
    <button type="button">Tell me about Mochi.</button>
    <button type="button">Is Otis good with toddlers?</button>
    <button type="button">Can I pay the adoption fee in cash?</button>
  </div>
  <form id="chat-form">
    <input id="message" autocomplete="off" placeholder="Ask about adopting...">
    <button id="send">Send</button>
  </form>

  <script>
    let sessionId = null;
    const messages = document.getElementById("messages");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function addMessage(text, role, toolCalls) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;  // textContent, not innerHTML: never render text as HTML
      if (toolCalls && toolCalls.length) {
        const tools = document.createElement("div");
        tools.className = "tools";
        tools.textContent = "Tools used: " + toolCalls.map(c => c.tool).join(", ");
        div.appendChild(tools);
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage(text) {
      addMessage(text, "user");
      send.disabled = true;
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Request failed");
        sessionId = data.session_id;
        addMessage(data.reply, "assistant", data.tool_calls);
      } catch (error) {
        addMessage("Error: " + error.message, "error");
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    document.getElementById("chat-form").addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendMessage(text);
    });
    document.querySelectorAll(".examples button").forEach(button =>
      button.addEventListener("click", () => sendMessage(button.textContent)));
  </script>
</body>
</html>
