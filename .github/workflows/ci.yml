name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests (no API key needed; LLM calls are faked)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t rescuepaws-ai .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name rescuepaws rescuepaws-ai
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          curl -sf localhost:8000/animals/RP-0009 | grep -q Taro
          curl -sf localhost:8000/ | grep -q "RescuePaws AI"
      - name: Show container logs
        if: always()
        run: docker logs rescuepaws || echo "No container was started"
